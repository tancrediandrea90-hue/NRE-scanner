  <!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner NRE - Multiplo</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 100%;
            box-sizing: border-box;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { color: #2c3e50; margin-top: 0; font-size: 22px; }
        .btn-upload {
            background-color: #0076ff;
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(0,118,255,0.2);
            margin-bottom: 10px;
        }
        #status {
            margin: 15px 0;
            font-weight: bold;
            color: #7f8c8d;
            font-size: 15px;
        }
        .barcode-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        .barcode-image {
            width: 100%;
            max-width: 340px;
            height: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Scanner Rapido NRE</h2>
    <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Carica uno o più screenshot o usa la fotocamera per generare i codici a barre.</p>
    
    <label for="file-input">
        <div class="btn-upload">📱 SELEZIONA O FOTOGRAFA RICETTE</div>
    </label>
    <input type="file" id="file-input" accept="image/*" multiple style="display: none;">

    <div id="status">In attesa delle ricette...</div>
    
    <div id="result-area"></div>
</div>

<script>
// Set globale per evitare duplicati anche tra immagini diverse caricate nella stessa sessione
let codiciGeneratiGlobali = new Set();

document.getElementById('file-input').addEventListener('change', async function(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;

    const statusDiv = document.getElementById('status');
    const resultArea = document.getElementById('result-area');
    
    // Puliamo l'area dei risultati all'inizio di un nuovo caricamento di gruppo
    resultArea.innerHTML = ""; 
    codiciGeneratiGlobali.clear();
    
    let codiciTrovatiTotali = 0;

    // Ciclo asincrono per elaborare i file uno dopo l'altro
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        
        statusDiv.innerText = `🔄 Elaborazione immagine ${i + 1} di ${files.length}...`;
        statusDiv.style.color = "#d35400";

        try {
            const codiciEstratti = await processFile(file);
            
            codiciEstratti.forEach(codice => {
                if (!codiciGeneratiGlobali.has(codice)) {
                    codiciGeneratiGlobali.add(codice);
                    codiciTrovatiTotali++;
                    
                    // Creazione dinamica della card per il codice a barre
                    const card = document.createElement('div');
                    card.className = 'barcode-card';

                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.className = "barcode-image";
                    card.appendChild(svg);
                    resultArea.appendChild(card);

                    JsBarcode(svg, codice, {
                        format: "CODE128",
                        width: 2.5,
                        height: 90,
                        displayValue: true,
                        fontSize: 20,
                        textMargin: 8,
                        background: "#ffffff"
                    });
                }
            });
        } catch (err) {
            console.error(`Errore durante l'elaborazione del file ${file.name}:`, err);
        }
    }

    // Aggiornamento finale dello stato
    if (codiciTrovatiTotali > 0) {
        statusDiv.innerText = `✅ Completato! Generati ${codiciTrovatiTotali} codici a barre.`;
        statusDiv.style.color = "#27ae60";
    } else {
        statusDiv.innerText = "❌ Nessun codice NRE valido trovato nei file selezionati.";
        statusDiv.style.color = "#c0392b";
    }
});

// Funzione helper che processa la singola immagine con Tesseract e restituisce una Promise
function processFile(file) {
    return new Promise((resolve, reject) => {
        Tesseract.recognize(file, 'ita')
            .then(({ data: { text } }) => {
                const regexNRE = /[0-9A-Z\s\-]{15,20}/g;
                const segmenti = text.match(regexNRE) || [];
                let codiciValidi = [];
                
                segmenti.forEach(seg => {
                    const pulito = seg.replace(/[\s\-]/g, '');
                    if (pulito.length === 15 && /^[0-9]{2}[0-9A-Z]{13}$/.test(pulito)) {
                        codiciValidi.push(pulito);
                    }
                });
                
                resolve(codiciValidi);
            })
            .catch(err => reject(err));
    });
}
</script>
</body>
</html>
